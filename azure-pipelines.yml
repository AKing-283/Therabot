trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  pythonVersion: "3.11"

  artifactName: "therabot-drop"
  packagePath: "$(Build.ArtifactStagingDirectory)/therabot.zip"

  azureServiceConnection: "sc-therabot-mlops"

  webAppName: "therabotmlopsapp283"
  resourceGroupName: "therabot-mlops"

  # IMPORTANT FIX
  mlflowTrackingUri: "file:./mlruns"

  modelName: "TherabotEmotionModel"
  modelStage: "Production"

stages:

# =========================================================
# BUILD STAGE
# =========================================================

- stage: Build
  displayName: "Build and Validate"

  jobs:

    - job: BuildJob
      displayName: "Install + Validate"

      pool:
        vmImage: "ubuntu-latest"

      steps:

        - checkout: self

        - task: UsePythonVersion@0
          inputs:
            versionSpec: "$(pythonVersion)"
            addToPath: true

        # =================================================
        # INSTALL DEPENDENCIES
        # =================================================

        - script: |
            set -e

            python -m pip install --upgrade pip

            pip install Flask
            pip install Flask-Login
            pip install Flask-SQLAlchemy
            pip install Flask-Migrate
            pip install Flask-WTF
            pip install Werkzeug
            pip install gunicorn
            pip install numpy
            pip install pandas
            pip install scikit-learn
            pip install xgboost
            pip install mlflow
            pip install nltk
            pip install textblob
            pip install requests
            pip install python-dotenv
            pip install joblib
            pip install scipy
            pip install jinja2
            pip install itsdangerous
            pip install click
            pip install blinker
            pip install sqlalchemy
            pip install alembic

            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi

          displayName: "Install Dependencies"

        # =================================================
        # PYTHON + FLASK CHECKS
        # =================================================

        - script: |
            set -e

            export MLFLOW_TRACKING_URI="file:./mlruns"

            python -m compileall app mlops wsgi.py

            python -c "from app.app import app; print('Flask app import check passed')"

          displayName: "Flask Sanity Checks"

        # =================================================
        # CREATE ZIP
        # =================================================

        - task: ArchiveFiles@2
          displayName: "Create ZIP Package"

          inputs:
            rootFolderOrFile: "$(Build.SourcesDirectory)"
            includeRootFolder: false
            archiveType: "zip"
            archiveFile: "$(packagePath)"
            replaceExistingArchive: true

        # =================================================
        # VERIFY ZIP EXISTS
        # =================================================

        - script: |
            echo "Listing artifact directory..."
            ls -la $(Build.ArtifactStagingDirectory)

          displayName: "Verify ZIP Exists"

        # =================================================
        # FIXED ARTIFACT PUBLISH
        # =================================================

        - task: PublishPipelineArtifact@1
          displayName: "Publish Pipeline Artifact"

          inputs:
            targetPath: "$(Build.ArtifactStagingDirectory)"
            artifact: "$(artifactName)"

# =========================================================
# DEPLOY STAGE
# =========================================================

- stage: Deploy
  displayName: "Deploy to Azure App Service"

  dependsOn: Build
  condition: succeeded()

  jobs:

    - deployment: DeployWeb
      displayName: "Deploy Web App"

      environment: "production"

      pool:
        vmImage: "ubuntu-latest"

      strategy:
        runOnce:

          deploy:

            steps:

              # ===========================================
              # DOWNLOAD PIPELINE ARTIFACT
              # ===========================================

              - download: current
                artifact: "$(artifactName)"

              # ===========================================
              # VERIFY DOWNLOADED FILE
              # ===========================================

              - script: |
                  echo "Downloaded artifact files:"
                  ls -la $(Pipeline.Workspace)/$(artifactName)

                displayName: "Verify Downloaded Artifact"

              # ===========================================
              # DEPLOY TO AZURE WEB APP
              # ===========================================

              - task: AzureWebApp@1
                displayName: "Deploy ZIP Package"

                inputs:
                  azureSubscription: "$(azureServiceConnection)"
                  appType: "webAppLinux"
                  appName: "$(webAppName)"
                  package: "$(Pipeline.Workspace)/$(artifactName)/therabot.zip"
                  runtimeStack: "PYTHON|3.11"
                  startUpCommand: "bash startup.sh"

              # ===========================================
              # CONFIGURE APP SETTINGS
              # ===========================================

              - task: AzureCLI@2
                displayName: "Configure App Settings"

                inputs:
                  azureSubscription: "$(azureServiceConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"

                  inlineScript: |
                    set -e

                    az webapp config appsettings set \
                      --resource-group "$(resourceGroupName)" \
                      --name "$(webAppName)" \
                      --settings \
                        FLASK_ENV=production \
                        PORT=8000 \
                        WEBSITES_PORT=8000 \
                        SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                        MLFLOW_TRACKING_URI="$(mlflowTrackingUri)" \
                        MODEL_NAME="$(modelName)" \
                        MODEL_STAGE="$(modelStage)"

                    az webapp config set \
                      --resource-group "$(resourceGroupName)" \
                      --name "$(webAppName)" \
                      --startup-file "bash startup.sh"

                    echo "======================================"
                    echo "Deployment Completed Successfully"
                    echo "======================================"

                    echo "App URL:"
                    echo "https://$(webAppName).azurewebsites.net"

                    echo "Health URL:"
                    echo "https://$(webAppName).azurewebsites.net/health"

                    echo "======================================"
