trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: "sc-therabot-mlops"

  resourceGroupName: "therabot-mlops"
  location: "southeastasia"

  acrName: "therabotmlopsacr283"
  imageRepository: "therabot-mlops"

  containerAppEnvironment: "therabot-aca-env"
  containerAppName: "therabot-mlops-aca"

  modelName: "TherabotEmotionModel"
  modelStage: "Production"

  mlflowTrackingUri: "http://localhost:5000"

  dbPath: "/mnt/therabot-data/therabot.db"
  metricsPath: "/mnt/therabot-data/metrics.json"

stages:

# =========================================================
# STAGE 1 - VALIDATE APPLICATION
# =========================================================

- stage: Validate
  displayName: "Validate Python Application"

  jobs:
    - job: ValidateJob
      displayName: "Install Dependencies and Run Checks"

      timeoutInMinutes: 30

      pool:
        vmImage: "ubuntu-latest"

      steps:

        - checkout: self

        - task: UsePythonVersion@0
          inputs:
            versionSpec: "3.11"
            addToPath: true

        - script: |
            set -e

            echo "Upgrading pip..."

            python -m pip install --upgrade pip

            echo "Installing dependencies..."

            pip install -r requirements.txt

          displayName: "Install Python Dependencies"

        - script: |
            set -e

            echo "Running Python compile checks..."

            python -m compileall app mlops wsgi.py

            echo "Running Flask import checks..."

            python -c "
from app.app import app
print('Flask import check passed')
"

          displayName: "Flask Sanity Checks"

# =========================================================
# STAGE 2 - BUILD + PUSH IMAGE
# =========================================================

- stage: BuildAndPush
  displayName: "Build and Push Docker Image"

  dependsOn: Validate
  condition: succeeded()

  jobs:

    - job: BuildPushJob
      displayName: "Build Docker Image"

      timeoutInMinutes: 60

      pool:
        vmImage: "ubuntu-latest"

      steps:

        - checkout: self

        - task: AzureCLI@2
          displayName: "Build and Push Image to ACR"

          inputs:
            azureSubscription: "$(azureServiceConnection)"
            scriptType: "bash"
            scriptLocation: "inlineScript"

            inlineScript: |
              set -e

              IMAGE_TAG="$(Build.SourceVersion)"

              echo "======================================"
              echo "Building Docker image"
              echo "======================================"

              echo "Image tag:"
              echo "${IMAGE_TAG}"

              az acr build \
                --registry "$(acrName)" \
                --image "$(imageRepository):${IMAGE_TAG}" \
                .

              echo "======================================"
              echo "Docker image pushed successfully"
              echo "======================================"

# =========================================================
# STAGE 3 - DEPLOY TO ACA
# =========================================================

- stage: DeployACA
  displayName: "Deploy to Azure Container Apps"

  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:

    - deployment: DeployACAJob
      displayName: "Deploy Container App"

      timeoutInMinutes: 60

      environment: "production"

      pool:
        vmImage: "ubuntu-latest"

      strategy:
        runOnce:

          deploy:

            steps:

              - task: AzureCLI@2
                displayName: "Deploy Azure Container App"

                inputs:
                  azureSubscription: "$(azureServiceConnection)"
                  scriptType: "bash"
                  scriptLocation: "inlineScript"

                  inlineScript: |
                    set -e

                    echo "======================================"
                    echo "Starting Azure Container Apps Deployment"
                    echo "======================================"

                    az config set extension.use_dynamic_install=yes_without_prompt

                    IMAGE_TAG="$(Build.SourceVersion)"

                    echo "Fetching ACR login server..."

                    ACR_LOGIN_SERVER=$(az acr show \
                      --name "$(acrName)" \
                      --query loginServer \
                      -o tsv)

                    IMAGE="${ACR_LOGIN_SERVER}/$(imageRepository):${IMAGE_TAG}"

                    echo "Using image:"
                    echo "$IMAGE"

                    echo "Installing Azure Container Apps extension..."

                    az extension add \
                      --name containerapp \
                      --upgrade \
                      --yes

                    echo "Checking ACA Environment..."

                    ACA_ENV_EXISTS=$(az containerapp env show \
                      --name "$(containerAppEnvironment)" \
                      --resource-group "$(resourceGroupName)" \
                      --query name \
                      -o tsv 2>/dev/null || true)

                    if [ -z "$ACA_ENV_EXISTS" ]; then

                      echo "Creating ACA Environment..."

                      az containerapp env create \
                        --name "$(containerAppEnvironment)" \
                        --resource-group "$(resourceGroupName)" \
                        --location "$(location)"

                    else

                      echo "ACA Environment already exists."

                    fi

                    echo "Checking existing Container App..."

                    APP_EXISTS=$(az containerapp show \
                      --name "$(containerAppName)" \
                      --resource-group "$(resourceGroupName)" \
                      --query name \
                      -o tsv 2>/dev/null || true)

                    echo "Fetching ACR credentials..."

                    ACR_USERNAME=$(az acr credential show \
                      -n "$(acrName)" \
                      --query username \
                      -o tsv)

                    ACR_PASSWORD=$(az acr credential show \
                      -n "$(acrName)" \
                      --query "passwords[0].value" \
                      -o tsv)

                    if [ -z "$APP_EXISTS" ]; then

                      echo "Creating Azure Container App..."

                      az containerapp create \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroupName)" \
                        --environment "$(containerAppEnvironment)" \
                        --image "$IMAGE" \
                        --target-port 8000 \
                        --ingress external \
                        --min-replicas 1 \
                        --max-replicas 2 \
                        --registry-server "$ACR_LOGIN_SERVER" \
                        --registry-username "$ACR_USERNAME" \
                        --registry-password "$ACR_PASSWORD" \
                        --env-vars \
                          FLASK_ENV=production \
                          PORT=8000 \
                          MLFLOW_TRACKING_URI="$(mlflowTrackingUri)" \
                          MODEL_NAME="$(modelName)" \
                          MODEL_STAGE="$(modelStage)" \
                          DB_PATH="$(dbPath)" \
                          METRICS_PATH="$(metricsPath)"

                    else

                      echo "Updating existing Azure Container App..."

                      az containerapp update \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroupName)" \
                        --image "$IMAGE" \
                        --set-env-vars \
                          FLASK_ENV=production \
                          PORT=8000 \
                          MLFLOW_TRACKING_URI="$(mlflowTrackingUri)" \
                          MODEL_NAME="$(modelName)" \
                          MODEL_STAGE="$(modelStage)" \
                          DB_PATH="$(dbPath)" \
                          METRICS_PATH="$(metricsPath)"

                    fi

                    echo "Fetching deployed application URL..."

                    FQDN=$(az containerapp show \
                      --name "$(containerAppName)" \
                      --resource-group "$(resourceGroupName)" \
                      --query properties.configuration.ingress.fqdn \
                      -o tsv)

                    echo "======================================"
                    echo "DEPLOYMENT SUCCESSFUL"
                    echo "======================================"
                    echo "Application URL:"
                    echo "https://${FQDN}"
                    echo "======================================"
